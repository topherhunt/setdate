name: Build and Release

# A version tag (created by scripts/release.sh) builds the macOS .dmgs and Windows
# installer and publishes them as a GitHub Release for that tag.
# Can also be run manually (workflow_dispatch) to verify the builds without releasing.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write # required for the release job to create/update the Release

jobs:
  build:
    strategy:
      fail-fast: false # a failure on one OS shouldn't cancel the other
      matrix:
        include:
          - os: macos-latest
            script: dist:mac
            assets: dist/*.dmg
          - os: windows-latest
            script: dist:win
            assets: dist/*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # On macOS this also re-signs the bundle ad-hoc and fails the build if the
      # signature doesn't verify -- see scripts/after-pack.js.
      - run: npm run ${{ matrix.script }}

      - uses: actions/upload-artifact@v5
        with:
          name: dist-${{ matrix.os }}
          path: ${{ matrix.assets }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') # only release on a tag, not manual runs
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: artifacts

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
